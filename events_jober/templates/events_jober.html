<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мероприятия | Работодатель</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fcfcfc; color: #333; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 1200px; width: 100%; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden; border-top: 5px solid #8b0000; }
        h1 { text-align: center; color: #8b0000; padding: 30px 20px 10px; margin: 0; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
        
        .request-link-container { text-align: center; margin-bottom: 20px; }
        .btn-request { display: inline-block; background-color: #fff0f0; color: #8b0000; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; font-size: 16px; transition: all 0.2s; border: 1px solid #8b0000; cursor: pointer; }
        .btn-request:hover { background-color: #8b0000; color: white; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); overflow-y: auto; }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 30px; border: 1px solid #888; width: 90%; max-width: 600px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); position: relative; }
        .close-btn { color: #aaa; position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #8b0000; }
        .modal-content h2 { color: #8b0000; margin-top: 0; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #8b0000; outline: none; }
        .modal-content .btn-submit { width: 100%; padding: 12px; background-color: #8b0000; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .modal-content .btn-submit:hover { background-color: #5a0000; }

        .filters { display: flex; justify-content: center; gap: 15px; padding: 0 40px 30px; flex-wrap: wrap; border-bottom: 1px solid #eee; margin-bottom: 20px; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 14px; color: #555; font-weight: 500; }
        .filters select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; font-family: inherit; font-size: 14px; color: #333; cursor: pointer; outline: none; transition: border-color 0.2s; }
        .filters select:focus, .filters select:hover { border-color: #8b0000; }

        .content { display: flex; gap: 30px; padding: 0 40px 40px; flex-wrap: wrap; }
        .sidebar { flex: 1; min-width: 280px; border-right: 1px solid #eee; padding-right: 30px; }
        .program-list { list-style: none; padding: 0; margin: 0; }
        .program-list li { padding: 12px 15px; margin-bottom: 6px; background-color: #f9f9f9; border-left: 4px solid transparent; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-weight: 500; font-size: 14px; line-height: 1.3; }
        .program-list li:hover { background-color: #fff0f0; border-left-color: #8b0000; color: #8b0000; }
        .program-list li.active { background-color: #8b0000; color: white; border-left-color: #5a0000; }

        .details { flex: 2.5; min-width: 400px; padding-left: 20px; }
        .detail-card { display: none; animation: fadeIn 0.3s ease; }
        .detail-card.active { display: block; }
        .no-results { display: none; color: #777; font-style: italic; padding: 20px 0; text-align: center; }
        .no-results.show { display: block; }

        .detail-card h2 { color: #8b0000; margin-top: 0; border-bottom: 2px solid #8b0000; padding-bottom: 12px; font-size: 22px; line-height: 1.3; }
        .info-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid #eee; gap: 20px; }
        .info-label { color: #777; flex-shrink: 0; font-size: 15px; width: 180px; }
        .info-value { font-weight: bold; color: #333; text-align: right; font-size: 15px; line-height: 1.5; }
        .info-value.highlight { background-color: #fff0f0; color: #8b0000; padding: 2px 8px; border-radius: 4px; border: 1px solid #f0d0d0; }
        .info-value.description-text { text-align: right; font-weight: 400; color: #444; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .filters { flex-direction: column; align-items: stretch; padding: 0 20px 20px; }
            .filter-group { justify-content: space-between; }
            .content { flex-direction: column; padding: 0 20px 20px; }
            .sidebar { border-right: none; border-bottom: 1px solid #eee; padding-right: 0; padding-bottom: 20px; }
            .details { padding-left: 0; min-width: auto; }
            .info-label { width: 140px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Календарь мероприятий</h1>
    <div class="subtitle">Режим просмотра для работодателей</div>

    <div class="request-link-container">
        <button class="btn-request" id="openModalBtn">✎ Оставить заявку на изменение / добавление</button>
    </div>

    <div class="filters">
        <div class="filter-group">
            <label for="sortDate">Дата:</label>
            <select id="sortDate"><option value="asc">По возрастанию</option><option value="desc">По убыванию</option></select>
        </div>
        <div class="filter-group">
            <label for="filterFormat">Формат:</label>
            <select id="filterFormat"><option value="all">Все</option><option value="Офлайн">Офлайн</option><option value="Онлайн">Онлайн</option></select>
        </div>
        <div class="filter-group">
            <label for="filterType">Тип:</label>
            <select id="filterType"><option value="all">Все</option><option value="Лекция">Лекция</option><option value="Экскурсия">Экскурсия</option><option value="Олимпиада">Олимпиада</option><option value="Мастер-класс">Мастер-класс</option></select>
        </div>
        <div class="filter-group">
            <label for="filterOrg">Организатор:</label>
            <select id="filterOrg"><option value="all">Все</option><option value="uni">От вуза</option><option value="employer">От работодателей</option></select>
        </div>
    </div>

    <div class="content">
        <div class="sidebar">
            <ul class="program-list" id="programList"></ul>
            <div id="noResults" class="no-results">Мероприятий пока нет или они не подходят под фильтр.</div>
        </div>
        <div class="details" id="detailsContainer"></div>
    </div>
</div>

<!-- Модальное окно для заявки -->
<div id="requestModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <h2>Заявка вузу</h2>
        <p>Заполните поля, и вуз рассмотрит вашу заявку.</p>
        <form id="requestForm">
            <div class="form-group">
                <label for="reqTitle">Название мероприятия</label>
                <input type="text" id="reqTitle" required placeholder="Например: День открытых дверей">
            </div>
            
            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;"><label for="reqDate">Дата</label><input type="date" id="reqDate" required></div>
                <div style="flex: 1;"><label for="reqFormat">Формат</label><select id="reqFormat" required><option value="Офлайн">Офлайн</option><option value="Онлайн">Онлайн</option></select></div>
            </div>

            <div class="form-group">
                <label for="reqType">Тип мероприятия</label>
                <select id="reqType" required>
                    <option value="Лекция">Лекция</option>
                    <option value="Экскурсия">Экскурсия</option>
                    <option value="Олимпиада">Олимпиада</option>
                    <option value="Мастер-класс">Мастер-класс</option>
                </select>
            </div>

            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;"><label for="reqTime">Длительность</label><input type="text" id="reqTime" required placeholder="2 ч. 30 мин."></div>
                <div style="flex: 1;"><label for="reqOrg">Ваша организация</label><input type="text" id="reqOrg" required placeholder="ООО Ромашка"></div>
            </div>

            <div class="form-group">
                <label for="reqAddress">Адрес (если онлайн - пусто)</label>
                <input type="text" id="reqAddress" placeholder="г. Тула, пр. Ленина, д. 92">
            </div>

            <div class="form-group">
                <label for="reqDesc">Описание</label>
                <textarea id="reqDesc" rows="3" required placeholder="Подробности..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Отправить заявку</button>
        </form>
    </div>
</div>

<script>
    // --- Данные ---
    let defaultEvents = [
        { id: 1, title: 'Олимпиада по информатике', date: '2026-04-15', format: 'Офлайн', type: 'Олимпиада', orgType: 'uni', time: '3 ч. 00 мин.', org: 'Приемная комиссия ТулГУ', address: 'г. Тула, пр. Ленина, д. 92', desc: 'Проверьте свои знания в области программирования.' },
        { id: 2, title: 'Ярмарка вакансий "Карьера 2026"', date: '2026-05-20', format: 'Офлайн', type: 'Лекция', orgType: 'uni', time: '4 ч. 00 мин.', org: 'Центр карьеры ТулГУ', address: 'г. Тула, ул. Ф. Энгельса, д. 155', desc: 'Крупнейшее карьерное событие региона.' },
        { id: 3, title: 'Мастер-класс по IT', date: '2026-06-10', format: 'Онлайн', type: 'Мастер-класс', orgType: 'employer', time: '1 ч. 30 мин.', org: 'Компания "СберТех"', address: '—', desc: 'Современные подходы к разработке на Python.' },
        { id: 4, title: 'Экскурсия на завод "Сплав"', date: '2026-06-25', format: 'Офлайн', type: 'Экскурсия', orgType: 'employer', time: '3 ч. 00 мин.', org: 'АО "НПО "Сплав"', address: 'г. Тула, ул. Щегловская засека, д. 33', desc: 'Экскурсия для студентов старших курсов.' },
        { id: 5, title: 'Онлайн-вебинар "Поступление"', date: '2026-07-01', format: 'Онлайн', type: 'Лекция', orgType: 'uni', time: '1 ч. 00 мин.', org: 'Приемная комиссия', address: '—', desc: 'Разбор всех изменений в правилах приема.' }
    ];

    // Инициализация данных
    let eventsData;
    if (localStorage.getItem('tulgu_events')) {
        eventsData = JSON.parse(localStorage.getItem('tulgu_events'));
    } else {
        eventsData = defaultEvents;
        localStorage.setItem('tulgu_events', JSON.stringify(eventsData));
    }

    const programList = document.getElementById('programList');
    const detailsContainer = document.getElementById('detailsContainer');
    const noResults = document.getElementById('noResults');
    const sortDateSelect = document.getElementById('sortDate');
    const filterFormatSelect = document.getElementById('filterFormat');
    const filterTypeSelect = document.getElementById('filterType');
    const filterOrgSelect = document.getElementById('filterOrg');

    // --- Модальное окно ---
    const modal = document.getElementById('requestModal');
    document.getElementById('openModalBtn').onclick = () => modal.style.display = 'block';
    document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
    window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };

    document.getElementById('requestForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const newRequest = {
            id: Date.now(),
            dateSubmitted: new Date().toLocaleString('ru-RU'),
            status: 'pending',
            eventData: {
                title: document.getElementById('reqTitle').value,
                date: document.getElementById('reqDate').value,
                format: document.getElementById('reqFormat').value,
                type: document.getElementById('reqType').value,
                time: document.getElementById('reqTime').value,
                org: document.getElementById('reqOrg').value,
                orgType: 'employer', 
                address: document.getElementById('reqAddress').value || '—',
                desc: document.getElementById('reqDesc').value
            }
        };

        let requests = JSON.parse(localStorage.getItem('tulgu_requests')) || [];
        requests.push(newRequest);
        localStorage.setItem('tulgu_requests', JSON.stringify(requests));

        alert('Заявка отправлена вузу!');
        document.getElementById('requestForm').reset();
        modal.style.display = 'none';
    });

    function getOrgType(event) { return event.orgType || 'uni'; }

    function renderSite() {
        programList.innerHTML = '';
        detailsContainer.innerHTML = '';

        if (eventsData.length === 0) { noResults.classList.add('show'); return; } else { noResults.classList.remove('show'); }

        const sortOrder = sortDateSelect.value;
        eventsData.sort((a, b) => {
            const dateA = new Date(a.date); const dateB = new Date(b.date);
            return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
        });

        const formatFilter = filterFormatSelect.value;
        const typeFilter = filterTypeSelect.value;
        const orgFilter = filterOrgSelect.value;

        const filteredEvents = eventsData.filter(ev => {
            const matchFormat = (formatFilter === 'all' || ev.format === formatFilter);
            const matchType = (typeFilter === 'all' || ev.type === typeFilter);
            const matchOrg = (orgFilter === 'all' || getOrgType(ev) === orgFilter);
            return matchFormat && matchType && matchOrg;
        });

        if (filteredEvents.length === 0) { noResults.classList.add('show'); return; }

        filteredEvents.forEach((event, index) => {
            const li = document.createElement('li');
            li.textContent = event.title;
            if (index === 0) li.classList.add('active');
            li.dataset.id = event.id;
            li.addEventListener('click', function() {
                document.querySelectorAll('#programList li').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.detail-card').forEach(el => el.classList.remove('active'));
                document.getElementById(`card-${event.id}`).classList.add('active');
            });
            programList.appendChild(li);

            const card = document.createElement('div');
            card.className = `detail-card ${index === 0 ? 'active' : ''}`;
            card.id = `card-${event.id}`;
            const dateObj = new Date(event.date);
            const formattedDate = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

            card.innerHTML = `
                <h2>${event.title}</h2>
                <div class="info-row"><span class="info-label">Организатор:</span><span class="info-value">${event.org}</span></div>
                <div class="info-row"><span class="info-label">Дата проведения:</span><span class="info-value">${formattedDate}</span></div>
                <div class="info-row"><span class="info-label">Тип мероприятия:</span><span class="info-value">${event.type}</span></div>
                <div class="info-row"><span class="info-label">Форма проведения:</span><span class="info-value highlight">${event.format}</span></div>
                <div class="info-row"><span class="info-label">Длительность:</span><span class="info-value">${event.time}</span></div>
                <div class="info-row"><span class="info-label">Адрес:</span><span class="info-value">${event.address || '—'}</span></div>
                <div class="info-row"><span class="info-label">Описание:</span><span class="info-value description-text">${event.desc}</span></div>
            `;
            detailsContainer.appendChild(card);
        });
    }

    sortDateSelect.addEventListener('change', renderSite);
    filterFormatSelect.addEventListener('change', renderSite);
    filterTypeSelect.addEventListener('change', renderSite);
    filterOrgSelect.addEventListener('change', renderSite);
    
    renderSite();
</script>
</body>
</html>

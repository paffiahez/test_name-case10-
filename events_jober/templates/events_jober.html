<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мероприятия | Работодатель</title>
    <style>
        /* ... (оставляем твои стили для jober) ... */
        .btn-request { display: inline-block; background-color: #fff0f0; color: #8b0000; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; font-size: 16px; transition: all 0.2s; border: 1px solid #8b0000; cursor: pointer; }
        .btn-request:hover { background-color: #8b0000; color: white; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 10% auto; padding: 30px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .modal-content h2 { color: #8b0000; margin-top: 0; }
        .modal-content textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px; box-sizing: border-box; margin-bottom: 20px; }
        .modal-content .btn-submit { width: 100%; padding: 12px; background-color: #8b0000; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        /* ... (остальные твои стили для карточек и фильтров) ... */
    </style>
</head>
<body>
<div class="container">
    <h1>Календарь мероприятий</h1>
    <div class="subtitle">Режим просмотра для работодателей</div>

    <div class="admin-link-container" style="text-align: center; margin-bottom: 20px;">
        <button class="btn-request" id="openModalBtn">✎ Оставить заявку на изменение / добавление</button>
    </div>

    <!-- Фильтры (такие же) -->
    <div class="filters">...</div>

    <div class="content">
        <div class="sidebar"><ul id="programList"></ul></div>
        <div class="details" id="detailsContainer"></div>
    </div>
</div>

<!-- Модальное окно для заявки -->
<div id="requestModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <h2>Заявка вузу</h2>
        <p>Опишите, что вы хотите добавить или изменить.</p>
        <form id="requestForm">
            <textarea id="requestText" rows="5" required placeholder="Например: Прошу добавить мастер-класс от нашей компании..."></textarea>
            <button type="submit" class="btn-submit">Отправить заявку</button>
        </form>
    </div>
</div>

<script>
    // ... (твои данные и рендер списка из старого кода) ...
    
    // Логика заявки
    const modal = document.getElementById('requestModal');
    document.getElementById('openModalBtn').onclick = () => modal.style.display = 'block';
    document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
    window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };

    document.getElementById('requestForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const text = document.getElementById('requestText').value.trim();
        if (!text) return;

        let requests = JSON.parse(localStorage.getItem('tulgu_requests')) || [];
        requests.push({ id: Date.now(), text: text, date: new Date().toLocaleString('ru-RU'), status: 'pending' });
        localStorage.setItem('tulgu_requests', JSON.stringify(requests));

        alert('Заявка отправлена вузу!');
        document.getElementById('requestForm').reset();
        modal.style.display = 'none';
    });
</script>
</body>
</html>

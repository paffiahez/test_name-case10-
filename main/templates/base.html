<html lang="ru">

</head>
<body>

    <!-- Верхняя серая полоса (Plate) -->

        {% block header_content %}
        <nav class="top-menu">
            <a href="#" class="top-btn">Кнопка 1</a>
            <a href="#" class="top-btn">Кнопка 2</a>
                <a href="#" class="top-btn">Кнопка 3</a>

        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
